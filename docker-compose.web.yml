services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_BASE_URL: /aurorae-haven/
    ports:
      - '8080:80'
    depends_on:
      - postgres
      - pgbouncer

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aurorae_haven
      POSTGRES_USER: aurorae
      POSTGRES_PASSWORD: change-me
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgresql/init:/docker-entrypoint-initdb.d
    ports:
      - '5432:5432'

  pgbouncer:
    image: edoburu/pgbouncer:1.24.1-p1
    environment:
      DB_USER: aurorae
      DB_PASSWORD: change-me
      DB_HOST: postgres
      DB_NAME: aurorae_haven
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
    depends_on:
      - postgres
    ports:
      - '6432:5432'

  db-migrate:
    image: postgres:16-alpine
    depends_on:
      - postgres
    volumes:
      - ./database/postgresql/migrations:/migrations:ro
    entrypoint:
      - sh
      - -c
      - >-
        until pg_isready -h postgres -p 5432 -U aurorae; do echo 'waiting for postgres'; sleep 2; done &&
        psql "postgresql://aurorae:change-me@postgres:5432/aurorae_haven" -f /migrations/001_account_schema.sql

volumes:
  postgres_data:
