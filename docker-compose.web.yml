services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_BASE_URL: /aurorae-haven/
    ports:
      - '8080:80'
    environment:
      # Frontend build/runtime requirement only.
      # Backend API and database lifecycle are managed outside this repository.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000}
