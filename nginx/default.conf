server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # style-src includes 'unsafe-inline' because the React UI uses inline style={{}} attributes
  # throughout many components. Refactoring all of them to CSS classes is a separate task.
  # connect-src: 'self' only. External fetches (e.g. calendar subscriptions, API) must be
  # proxied through Nginx (proxy_pass) to remain same-origin, or their specific origins must
  # be added here explicitly. Avoid broad "https:" — it defeats exfiltration protection.
  # Example: to allow a specific calendar host, add its origin inside the
  # Content-Security-Policy header's connect-src directive value:
  #   connect-src 'self' https://calendar.example.com;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), hid=(), identity-credentials-get=(), idle-detection=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), usb=(), web-share=(), xr-spatial-tracking=()" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }
}
